[project]
name = "genai-km-thesis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.83.4",
    "presidio-analyzer==2.2.362",
    "presidio-anonymizer>=2.2.361",
    "spacy>=3.8,<4",
    "en-core-web-lg>=3.8,<4",
    "jsonschema[format]>=4.23",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15,<0.16",
    "strands-agents[litellm]>=0.1",
]

[project.scripts]
km = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
