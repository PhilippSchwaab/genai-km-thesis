          entry: |
            ## Summary
            PDF export was implemented using Puppeteer; the lighter-weight alternative was rejected on chart-rendering quality.

            ## Decisions (each paired with its driver and at least one alternative considered)
            - Use Puppeteer with a server-side rendering helper. Driver: chart rendering quality on Recharts components. Alternative considered: wkhtmltopdf (rejected because chart rendering quality was below acceptable).

            ## Consequences
            - Puppeteer brings a Chromium dependency to the server-side rendering helper.
            - The rejected wkhtmltopdf alternative would have been lighter-weight but did not meet chart-rendering quality requirements.

            ## Open questions and risks
            - (none recorded)

