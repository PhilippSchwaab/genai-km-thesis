# Architecture B — Agentic Workflow: Writer agent prompt
# CL-06 splits the Run-1 single-agent + self-reflection design into two
# cooperating agents. This prompt drives the Writer; the Reviewer is
# driven by `agentic_reviewer.yaml`. The runner cycles Writer ↔ Reviewer
# until the Reviewer returns `NONE` (or until the max-iteration cap).
#
# v2 (thesis §4.2.3):
#   - CL-03: user turn reordered so the source artifact precedes the task
#     instruction. The source becomes the stable prefix the Writer
#     re-reads on every revision cycle, enabling cache breakpoints
#     (CL-05).
#   - CL-04: concision directive lives on the Reviewer prompt
#     (`agentic_reviewer.yaml`) — only the Reviewer produces
#     intermediate work, the Writer's output is the final wiki entry.
#   - CL-06: Writer's responsibilities are reduced to draft + revise.
#     The REVIEW step has been removed from the system prompt because
#     the Reviewer sub-agent handles it.
#   - CL-01: audience parameter and per-audience section schema. The
#     {audience} and {audience_schema} placeholders are substituted at
#     render time from `meta.audiences.<name>`. Audience defaults to
#     `development` (matches the Run-1 schema closest); `marketing` and
#     `architect` are the additional audiences for the Run-2 showcase.
#   - CL-02: two synthetic exemplars per audience under `.exemplars`,
#     spliced as user/assistant pairs before the live user turn (passed
#     to Strands' Agent.messages). Exemplars share the live user-template
#     wrapper so format consistency is preserved (Min et al. EMNLP 2022).
#     Sources are synthetic (no Control-Set leakage). Schemas and
#     exemplar content are intentionally identical to the pipeline
#     prompt's so both architectures target the same output structure.

meta:
  id: agentic_generate_wiki
  architecture: agentic
  version: 2
  model: anthropic/claude-sonnet-4-6 # ollama_chat/gemma4:26b
  sampling:
    temperature: 0.3
    max_tokens: 16384
  description: >
    Writer agent for the agentic Writer/Reviewer loop. Extracts facts
    from the source artifact and produces a structured wiki entry
    tailored for the requested audience. When the Reviewer returns
    issues, the Writer revises the entry in-place and re-emits it.
  audiences:
    development:
      schema: |
        ## Summary
        ## Decisions
        ## Action items (with owner and due date where stated)
        ## Blockers and open questions
        ## Implementation detail (commits, files, line counts where present)
        ## Sources
      exemplars:
        - artifact_id: example_pdf_export
          artifact_type: support_report
          source: |
            Title: PDF export feature for analytics dashboard
            Status: shipped
            Date: 2026-02-15

            Background: [Customer A] requested the ability to export the analytics dashboard as PDF for offline distribution to executive stakeholders.

            Implementation: [Person 1] reviewed two options with [Person 2]. Decision: use Puppeteer with a server-side rendering helper. Alternative considered: wkhtmltopdf, rejected because chart rendering quality on Recharts components was below acceptable. PR #614 merged 2026-02-14, deployed 2026-02-15.

            Customer feedback: "Reduced our manual reporting time by approximately four hours per week."
          entry: |
            ## Summary
            PDF export feature shipped on 2026-02-15 for the analytics dashboard.

            ## Decisions
            - Use Puppeteer with a server-side rendering helper for PDF generation. Driver: chart rendering quality. Alternative considered: wkhtmltopdf (rejected on chart-quality grounds for Recharts components).

            ## Action items (with owner and due date where stated)
            - (none recorded)

            ## Blockers and open questions
            - (none recorded)

            ## Implementation detail (commits, files, line counts where present)
            - PR #614 merged 2026-02-14, deployed 2026-02-15.

            ## Sources
            - PDF export feature report (2026-02-15).
        - artifact_id: example_standup_w12
          artifact_type: development_activity
          source: |
            Title: Standup notes — Sprint 24, mid-sprint check-in
            Date: 2026-W12

            [Person 3]: Database connection pool exhausted in staging during yesterday's load test. Connection wait p99 spiked to 4 seconds. Decision: bump max_connections from 200 to 500. Driver: load-test latency. Alternative considered: introduce PgBouncer for connection multiplexing, rejected because it adds an operational dependency for marginal additional headroom at the team's current load.

            [Person 4]: PR #482 merged. Closes #401 (decimal rounding bug in invoice totals).

            Blocker: Schema migration #M-12 awaiting DBA approval. Target: end of week.
          entry: |
            ## Summary
            Mid-sprint standup capturing one infrastructure decision, one merged bug fix, and one blocker.

            ## Decisions
            - Bump `max_connections` from 200 to 500. Driver: load-test connection wait p99 spiked to 4 seconds. Alternative considered: PgBouncer connection multiplexing (rejected on operational complexity).

            ## Action items (with owner and due date where stated)
            - (none recorded)

            ## Blockers and open questions
            - Schema migration #M-12 awaiting DBA approval. Target: end of week.

