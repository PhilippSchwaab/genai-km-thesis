# Evaluation — KIP Scorer (LLM-as-Judge)
# Checks whether a specific KIP is present in a generated wiki entry.

meta:
  id: eval_kip_scorer
  architecture: eval
  version: 1
  model: anthropic/claude-sonnet-4-6
  sampling:
    temperature: 0.0
    max_tokens: 256
  description: >
    LLM-as-judge prompt for KIP recall scoring. Given a single KIP and
    a generated wiki entry, determines whether the fact is captured.

messages:
  - role: system
    content: |
      You are an evaluation judge for a knowledge management system.
      You will be given a specific fact (called a "Key Information Point")
      and a wiki entry generated by an AI system.

      Your task: determine whether the wiki entry captures this fact.

      Respond with exactly one of:
      - YES — the fact is clearly present in the wiki entry.
      - PARTIAL — the fact is partially present or implied but incomplete.
      - NO — the fact is missing from the wiki entry.

      Then provide a one-sentence justification.

      Format your response as:
      JUDGMENT: <YES|PARTIAL|NO>
      REASON: <one sentence>

  - role: user
    content: |
      Key Information Point:
      {kip_text}

      Generated wiki entry:
      ---
      {wiki_entry}
      ---

      Is this fact captured in the wiki entry?
