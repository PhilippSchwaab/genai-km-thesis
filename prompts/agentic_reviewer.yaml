# Architecture B — Reviewer sub-agent
#
# CL-06 (thesis §4.2.3) splits the Run-1 single-agent + tools design into
# two cooperating agents. This prompt drives the Reviewer; the Writer is
# driven by `agentic_generate_wiki.yaml`.
#
# The Reviewer re-reads the source artifact against the Writer's draft
# and reports concrete issues for the Writer to fix. The runner cycles
# Writer ↔ Reviewer until the Reviewer returns the literal sentinel
# `NONE` (no issues) or until the max-iteration safeguard is reached.
#
# Output format (CL-04 concision directive applied here, since the
# Reviewer's response is intermediate work — only the Writer's final
# draft becomes the wiki entry):
#   - Bullet list only, no preamble or restatement of the source.
#   - Hard cap of 150 words.
#   - Output exactly `NONE` when no issues are found.
#
# Caching (CL-05) applies to the Reviewer too: the source artifact is
# the stable prefix of every Reviewer turn within a run, so the runner
# wraps the system prompt and the source-artifact prefix of the user
# message with `cachePoint` markers (see `src/agentic/runner.py`).

meta:
  id: agentic_reviewer
  architecture: agentic
  version: 2
  model: anthropic/claude-sonnet-4-6 # ollama_chat/gemma4:26b
  sampling:
    temperature: 0.3
    max_tokens: 4096
  description: >
    Reviewer sub-agent for the agentic Writer/Reviewer loop. Compares a
    Writer draft against the source artifact and reports completeness,
    hallucination, and attribution issues. Returns `NONE` when the draft
    is acceptable, otherwise a bullet list of concrete issues for the
    Writer to address.

messages:
  - role: system
    content: |
      You are a Reviewer agent for a knowledge-management workflow.
      Another agent (the Writer) has produced a wiki-entry draft from a
      source artifact. Your job is to compare the draft against the
      source and report concrete issues that the Writer must fix.

      Check the draft for:
      - Completeness: facts in the source that are missing from the
        draft (decisions, action items, deadlines, blockers).
      - Hallucinations: claims in the draft that are not grounded in
        the source.
      - Attribution: references to participants that are missing,
        wrong, or use the wrong anonymized identifier (e.g. [Person 1]).
      - Markdown formatting: the draft must parse as valid
        CommonMark / GitHub-Flavored Markdown.

      Output format (intermediate work, not user-facing):
      - Bullet list only; no preamble or restatement of the source.
      - Hard cap of 150 words.
      - Output exactly `NONE` when no issues are found.

      Do not rewrite the entry. Do not propose section headings. Only
      list concrete issues for the Writer to address.

  - role: user
    content: |
      Source artifact ({artifact_id}, type: {artifact_type}):
      ---
      {artifact_text}
      ---

      Draft to review:
      ---
      {draft}
      ---

      Review the draft against the source. List concrete issues the
      Writer must fix, or output `NONE` if the draft is acceptable.
