# MCDA Configuration — Stakeholder-Weighted Criteria
# Source: Mentimeter session with 6 Meshmakers stakeholders, Feb 2026
# See docs/requirements/mcda_criteria.md for full rationale.

criteria:

  accuracy:
    weight: 0.30
    direction: higher_is_better    # higher recall = better
    metrics:
      - kip_recall
      - hallucination_rate         # direction overridden below

  verification_effort:
    weight: 0.25
    direction: lower_is_better     # less effort = better
    metrics:
      - review_time_minutes
      - edit_count

  completeness:
    weight: 0.20
    direction: higher_is_better
    metrics:
      - kip_recall_by_category     # per-category breakdown

  speed:
    weight: 0.15
    direction: lower_is_better     # faster = better
    metrics:
      - latency_seconds
      - token_throughput

  cost:
    weight: 0.10
    direction: lower_is_better     # cheaper = better
    metrics:
      - cost_per_artifact_eur
      - total_run_cost_eur

# Metric-level direction overrides (when a metric's direction
# differs from its parent criterion)
metric_overrides:
  hallucination_rate:
    direction: lower_is_better     # fewer hallucinations = better

# Alternative weight sets for sensitivity analysis
sensitivity_profiles:
  equal:
    accuracy: 0.20
    verification_effort: 0.20
    completeness: 0.20
    speed: 0.20
    cost: 0.20

  accuracy_dominated:
    accuracy: 0.50
    verification_effort: 0.15
    completeness: 0.15
    speed: 0.10
    cost: 0.10

  cost_dominated:
    accuracy: 0.20
    verification_effort: 0.15
    completeness: 0.15
    speed: 0.10
    cost: 0.40
