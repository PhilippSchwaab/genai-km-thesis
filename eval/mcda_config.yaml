# MCDA Configuration — Stakeholder-Weighted Criteria (Reduced Scope)
# Source: Mentimeter session with 6 Meshmakers stakeholders, Feb 2026
# Original 5 criteria reduced to 3 measured criteria.
# Accuracy and Verification Effort discussed qualitatively in Ch. 5.
# See docs/requirements/mcda_criteria.md for full rationale.

criteria:

  completeness:
    weight: 0.44
    direction: higher_is_better
    metrics:
      - kip_recall               # KIPs matched / total KIPs

  speed:
    weight: 0.33
    direction: lower_is_better   # faster = better
    metrics:
      - latency_seconds          # wall-clock time, input to final output

  cost:
    weight: 0.22
    direction: lower_is_better   # cheaper = better
    metrics:
      - cost_per_artifact_eur    # via LiteLLM cost tracking

# Alternative weight sets for sensitivity analysis
sensitivity_profiles:
  equal:
    completeness: 0.33
    speed: 0.33
    cost: 0.33

  completeness_dominated:
    completeness: 0.70
    speed: 0.15
    cost: 0.15

  cost_dominated:
    completeness: 0.20
    speed: 0.20
    cost: 0.60
